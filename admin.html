<style>
:root{--bg:#F8F4F4;--surface:#fff;--ink:#1E1416;--muted:#6B5A5D;--line:#EBDFE1;--brand:#B91725;--ok:#15803D}
@media (prefers-color-scheme: dark){:root{--bg:#140D0E;--surface:#1F1517;--ink:#F3EAEB;--muted:#B6A2A5;--line:#3A2A2D;--brand:#D42B3A;--ok:#5BD08A;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;font-size:16px}
.card{max-width:440px;margin:32px auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:14px}
@media (max-width:480px){.card{margin:16px}}
.top{display:flex;gap:12px;align-items:center}.top img{width:44px;height:44px;border-radius:11px}
h1{font-size:22px;margin:0}p{margin:0;color:var(--muted);font-size:14px}
label{font-size:13px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:6px}
input,select{font:inherit;color:inherit;min-height:46px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 12px}
button{font:inherit;min-height:48px;border:0;border-radius:10px;background:var(--brand);color:#fff;font-weight:700;cursor:pointer}
button[disabled]{opacity:.6}
.msg{padding:12px;border-radius:10px;font-size:14px;background:var(--bg)}.msg.ok{color:var(--ok);font-weight:600}.msg.err{color:var(--brand);font-weight:600}
</style>

  <p>Use this after a shop pays by cash or UPI. Ask the shop owner to open Ledgro → More → Plans and read out the Shop ID.</p>
  <label>Shop ID<input id="shop" required placeholder="e.g. 3f2a9c1e-5b7d-4e8a-9c21-7d4e5f6a8b90" spellcheck="false"></label>
  <label>Plan<select id="plan"><option value="starter">Starter (₹199/month)</option><option value="growth">Growth</option><option value="pro">Pro</option></select></label>
  <label>Months paid<select id="months"><option value="1">1 month (₹199)</option><option value="3">3 months (₹597)</option><option value="6">6 months (₹1,194)</option><option value="12">1 year (₹1,990)</option></select></label>
  <label>Admin key<input id="key" type="password" required autocomplete="current-password"></label>
  <button id="go">Activate</button>
  <div class="msg" id="msg" hidden></div>
</form>
<script>
const $=s=>document.querySelector(s);
$("#f").onsubmit=async e=>{e.preventDefault();const m=$("#msg");m.hidden=false;m.className="msg";m.textContent="Activating…";$("#go").disabled=true;
  try{const r=await fetch("/api/admin-activate",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+$("#key").value},
      body:JSON.stringify({shop:$("#shop").value.trim(),plan:$("#plan").value,months:$("#months").value})});
    const j=await r.json().catch(()=>({}));
    if(r.ok&&j.ok){m.className="msg ok";m.textContent="Activated: "+j.plan+" until "+j.until+". Ask the shop to reopen Ledgro.";$("#shop").value=""}
    else{m.className="msg err";m.textContent=j.error||("Could not activate (error "+r.status+").")}
  }catch(err){m.className="msg err";m.textContent="No internet connection. Try again."}
  $("#go").disabled=false};
</script>
</body>
