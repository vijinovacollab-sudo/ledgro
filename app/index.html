<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#B91725">
<meta name="description" content="Ledgro: encrypted khata, GST billing and daily reports for kirana shops. By VJ Hokhmah Pvt. Ltd.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{height:100%}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<title>Ledgro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Baloo+Chettan+2:wght@600;700&family=Baloo+Thambi+2:wght@600;700&family=Noto+Sans+Malayalam:wght@400;600&family=Noto+Sans+Tamil:wght@400;600&family=Noto+Sans:wght@400;600&display=swap">
<style>
/* Layout: a phone-width app column in VJ Hokhmah red — sticky shop header, scrolling view, fixed bottom tab bar; PIN gate screens before unlock. */
:root{
  --bg:#F8F4F4; --surface:#FFFFFF; --ink:#1E1416; --muted:#6B5A5D; --line:#EBDFE1;
  --brand:#B91725; --brand-ink:#FFFFFF; --brand-soft:#FBE8EA;
  --amber:#B91725; --amber-ink:#FFFFFF; --amber-soft:#FDF1DD;
  --owe:#C2410C; --owe-soft:#FDEDE4; --paid:#15803D; --paid-soft:#E4F4E8;
  --paper:#FFFFFF; --paper-ink:#1B1B1B; --paper-muted:#666666; --paper-line:#D9D9D9;
  --scrim:rgba(30,10,14,.45);
  --f-display:"Baloo 2","Baloo Thambi 2","Baloo Chettan 2",system-ui,sans-serif;
  --f-body:"Noto Sans","Noto Sans Tamil","Noto Sans Malayalam",system-ui,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#140D0E; --surface:#1F1517; --ink:#F3EAEB; --muted:#B6A2A5; --line:#3A2A2D;
  --brand:#D42B3A; --brand-ink:#FFFFFF; --brand-soft:#3A1519;
  --amber:#D42B3A; --amber-ink:#FFFFFF; --amber-soft:#3A2C10;
  --owe:#FB8F5C; --owe-soft:#3A2016; --paid:#5BD08A; --paid-soft:#173322;
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#140D0E; --surface:#1F1517; --ink:#F3EAEB; --muted:#B6A2A5; --line:#3A2A2D;
  --brand:#D42B3A; --brand-ink:#FFFFFF; --brand-soft:#3A1519;
  --amber:#D42B3A; --amber-ink:#FFFFFF; --amber-soft:#3A2C10;
  --owe:#FB8F5C; --owe-soft:#3A2016; --paid:#5BD08A; --paid-soft:#173322;
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--brand)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100%;background:var(--bg)}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3,.disp{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand);color:var(--brand-ink);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:10px}
.mark{width:38px;height:38px;border-radius:10px;background:var(--brand-ink);color:var(--brand);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:18px;overflow:hidden;flex:none}
.mark img{width:100%;height:100%;object-fit:cover}
.top .who{min-width:0;flex:1}
.top .who b{display:block;font-family:var(--f-display);font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .who small{opacity:.85;font-size:12px}
.langs{display:flex;background:rgba(255,255,255,.16);border-radius:999px;padding:3px;flex:none}
.langs button{border:0;background:transparent;color:inherit;padding:5px 9px;border-radius:999px;font-size:13px;font-weight:600;min-width:34px}
.langs button[aria-pressed="true"]{background:var(--brand-ink);color:var(--brand)}

main{padding-block:16px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}

/* cards & tiles */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.tile .lbl{font-size:13px;color:var(--muted)}
.tile .val{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.1;margin-top:4px}
.tile.hero{grid-column:1/-1;background:var(--brand);color:var(--brand-ink);border-color:transparent}
.tile.hero .lbl{color:inherit;opacity:.85}
.tile.hero .val{font-size:34px}
.split{display:flex;gap:16px;margin-top:8px;font-size:14px;flex-wrap:wrap}
.split span{opacity:.9}
.owe{color:var(--owe)} .paid{color:var(--paid)}
.banner{display:flex;gap:12px;align-items:center;background:var(--paid-soft);color:var(--ink);border-radius:var(--r);padding:12px 14px;font-size:14px}
.banner b{color:var(--paid)}
.note{font-size:12px;color:var(--muted);background:var(--amber-soft);border-radius:8px;padding:8px 10px}

.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec-h h2{font-size:20px}
.sec-h small{color:var(--muted);font-size:13px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.btn.brand{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.owe{background:var(--owe-soft);border-color:transparent;color:var(--owe)}
.btn.paid{background:var(--paid-soft);border-color:transparent;color:var(--paid)}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px;border-radius:10px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > .btn{flex:1 1 140px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.quick .btn{flex-direction:column;min-height:76px;font-size:13px;gap:4px;padding:8px}
.quick svg{width:24px;height:24px}

/* lists */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);min-width:0}
.item:first-child{border-top:0}
.item .main{flex:1;min-width:0}
.item .main b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .main small{color:var(--muted);font-size:13px}
.item .amt{font-family:var(--f-display);font-weight:700;font-size:18px;text-align:right;white-space:nowrap}
.item .amt small{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted)}
button.item{width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;padding-inline:0}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);font-weight:700;flex:none}
.search{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;white-space:nowrap}
.chip b{color:var(--muted);font-weight:400;margin-left:4px}

/* form */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--muted);font-weight:600}
.field input,.field select{min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 12px;width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;min-height:46px;border:0;background:var(--surface);font-weight:600;font-size:14px;padding:0 6px}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.radio{display:flex;flex-direction:column;gap:8px}
.radio label{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);font-size:15px}
.radio input{width:20px;height:20px;accent-color:var(--brand)}
.check{display:flex;gap:10px;align-items:center;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--brand)}

/* cart */
.cart .line{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.cart .line:first-child{border-top:0}
.cart .line small{color:var(--muted);font-size:12px}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px}
.qty button{width:36px;height:36px;border:0;background:none;font-size:18px;font-weight:700;color:var(--brand)}
.qty span{min-width:26px;text-align:center;font-weight:600}
.sum{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px;color:var(--muted)}
.sum .grand{font-family:var(--f-display);font-weight:700;font-size:24px;color:var(--ink)}

/* chart */
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:150px;padding-top:18px}
.bar{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.bar i{display:block;width:100%;max-width:34px;background:var(--brand-soft);border-radius:6px 6px 2px 2px;position:relative}
.bar.today i{background:var(--brand)}
.bar i em{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-style:normal;font-size:11px;color:var(--muted);white-space:nowrap;padding-bottom:2px}
.bar span{font-size:11px;color:var(--muted)}

/* plans */
.plans{display:flex;flex-direction:column;gap:12px}
.plan{border:1px solid var(--line);border-radius:var(--r);padding:16px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.plan.cur{border:2px solid var(--brand)}
.plan header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.plan header b{font-family:var(--f-display);font-size:20px}
.plan .price{font-family:var(--f-display);font-weight:700;font-size:26px}
.plan .price small{font-family:var(--f-body);font-size:13px;font-weight:400;color:var(--muted)}
.plan ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px}
.plan li{display:flex;gap:8px}
.plan li::before{content:"✓";color:var(--paid);font-weight:700}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--brand-soft);color:var(--brand)}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 10px;font-size:11.5px;color:var(--muted);min-height:58px}
nav.tabs svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--brand);font-weight:600}
nav.tabs button.mid span.dot{width:46px;height:46px;border-radius:14px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;margin-top:-18px;box-shadow:0 4px 12px rgba(0,0,0,.18)}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;
  padding-block:8px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 0}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-h h3{font-size:22px}
.x{border:0;background:var(--surface);width:40px;height:40px;border-radius:50%;font-size:20px;border:1px solid var(--line)}
.big-bal{text-align:center;padding:8px 0}
.big-bal .val{font-family:var(--f-display);font-weight:700;font-size:40px;line-height:1}
.big-bal small{color:var(--muted)}
.keypad-amt{font-family:var(--f-display);font-weight:700;font-size:36px;text-align:center;min-height:56px;border:1px solid var(--line);border-radius:12px;background:var(--surface);width:100%}
.words{text-align:center;font-size:13px;color:var(--muted);min-height:18px}

/* invoice */
.inv{background:var(--paper);color:var(--paper-ink);border-radius:8px;padding:18px 16px;font-size:13px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.inv .ihead{display:flex;gap:12px;align-items:flex-start;border-bottom:2px solid var(--paper-ink);padding-bottom:10px}
.inv .ilogo{width:52px;height:52px;border-radius:10px;background:#1E1416;color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:22px;flex:none;overflow:hidden}
.inv .ilogo img{width:100%;height:100%;object-fit:cover}
.inv h4{margin:0;font-family:var(--f-display);font-size:19px;line-height:1.1}
.inv .muted{color:var(--paper-muted)}
.inv .ttl{text-align:center;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12px;margin:10px 0 6px}
.inv .meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;margin-bottom:8px}
.inv .tblwrap{overflow-x:auto}
.inv table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.inv th{text-align:left;border-bottom:1px solid var(--paper-ink);padding:5px 4px;font-weight:600;white-space:nowrap}
.inv td{border-bottom:1px solid var(--paper-line);padding:5px 4px;vertical-align:top}
.inv td.r,.inv th.r{text-align:right}
.inv .tot{margin-top:8px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:12px;font-variant-numeric:tabular-nums}
.inv .tot .g{font-weight:700;font-size:15px;border-top:2px solid var(--paper-ink);padding-top:4px}
.inv .foot{margin-top:12px;padding-top:10px;border-top:1px dashed var(--paper-line);display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.inv .links{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.inv .links a{color:#B91725;font-weight:600;text-decoration:underline;display:inline-flex;gap:4px;align-items:center}


/* gates (welcome, setup, PIN) */
.gate{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:16px;padding-block:32px 40px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.glogo{width:72px;height:72px;border-radius:18px;display:block}
.gtitle{font-size:28px}
.gsub{margin:6px 0 0;color:var(--muted)}
.gstep{font-size:13px;font-weight:600;color:var(--brand);letter-spacing:.06em;text-transform:uppercase}
.gbtns{display:flex;flex-direction:column;gap:10px}
.gfine{font-size:13px;color:var(--muted);margin:0;text-align:center}
.pinin{font-family:var(--f-display);font-size:30px;letter-spacing:.5em;text-align:center;min-height:60px;border:1px solid var(--line);border-radius:12px;background:var(--surface);width:100%;padding:0 0 0 .5em}
.err{color:var(--owe);font-size:14px;margin:0}
.hint{font-size:13px;color:var(--muted);margin:0}
.banner.warn{background:var(--amber-soft);align-items:center;flex-wrap:wrap}
.btn[disabled]{opacity:.55}
/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;gap:14px;align-items:center;font-size:14px;max-width:calc(100% - 32px)}
.toast button{border:0;background:none;color:var(--amber);font-weight:700}
.empty{text-align:center;color:var(--muted);padding:18px 8px;font-size:14px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>

<div class="app" id="app"></div>
<div id="layer"></div>

<script src="config.js"></script>

/* Indian-system amount in words */
function words(num){
  num=Math.round(num);if(num===0)return"Zero";
  const a=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
  const b=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
  const two=n=>n<20?a[n]:b[Math.floor(n/10)]+(n%10?" "+a[n%10]:"");
  const three=n=>(n>=100?a[Math.floor(n/100)]+" Hundred"+(n%100?" ":""):"")+(n%100?two(n%100):"");
  let out=[];const cr=Math.floor(num/1e7);num%=1e7;const lk=Math.floor(num/1e5);num%=1e5;const th=Math.floor(num/1e3);num%=1e3;
  if(cr)out.push(three(cr)+" Crore");if(lk)out.push(two(lk)+" Lakh");if(th)out.push(two(th)+" Thousand");if(num)out.push(three(num));
  return out.join(" ");
}

/* ---------- events ---------- */
function bindView(){
  document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{S.shop.lang=b.dataset.lang;persist();render()});
  document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{q="";go(b.dataset.view)});
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{q="";go(b.dataset.go)});
  document.querySelectorAll("[data-cust]").forEach(b=>b.onclick=()=>custSheet(b.dataset.cust));
  document.querySelectorAll("[data-bill]").forEach(b=>b.onclick=()=>billSheet(b.dataset.bill));
  const qi=$("#q");if(qi){qi.oninput=()=>{q=qi.value;const pos=qi.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(pos,pos)}}
  document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>ACTS[b.dataset.act]());
  document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{const p=S.products.find(x=>x.id===b.dataset.add);const ex=draft.items.find(x=>x.pid===p.id);
    if(ex)ex.qty++;else draft.items.push({pid:p.id,name:p.name,hsn:p.hsn,gst:p.gst,qty:1,rate:p.price});render()});
  document.querySelectorAll("[data-qty]").forEach(b=>b.onclick=()=>{const it=draft.items[+b.dataset.qty];it.qty+=+b.dataset.d;if(it.qty<=0)draft.items.splice(+b.dataset.qty,1);render()});
  document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{draft.mode=b.dataset.mode;render()});
  const bn=$("#bname");if(bn)bn.oninput=()=>draft.cust=bn.value;
  const bp=$("#bphone");if(bp)bp.oninput=()=>draft.phone=bp.value;
  const bc=$("#bcust");if(bc)bc.onchange=()=>draft.custId=bc.value;
  const bi=$("#binter");if(bi)bi.onchange=()=>{draft.inter=bi.checked;render()};
  document.querySelectorAll('input[name="gst"]').forEach(r=>r.onchange=()=>{S.shop.gstType=r.value;persist();render()});
  const lg=$("#slogo");if(lg)lg.onchange=()=>{const f=lg.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>shrink(rd.result,v=>{S.shop.logo=v;persist();render();toast(t("saved"))});rd.readAsDataURL(f)};
  document.querySelectorAll("[data-plan]").forEach(b=>b.onclick=()=>rzpSheet(b.dataset.plan,b.dataset.pname,+b.dataset.price));
  bindExtra();
}
function shrink(src,cb){const im=new Image();im.onload=()=>{const c=document.createElement("canvas");const s=Math.min(1,160/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/png"))};im.onerror=()=>cb(src);im.src=src}

const ACTS={
  addcust(){sheet(`<div class="sheet-h"><h3>${esc(t("add_customer"))}</h3><button class="x" data-close aria-label="${esc(t("close"))}">×</button></div>
    ${fld("cname","customer_name","")}${fld("cphone","phone","","tel")}
    <div class="field"><label for="clang">${esc(t("reminder_lang"))}</label><select id="clang">${LANGS.map(([c,,n])=>`<option value="${c}" ${S.shop.lang===c?"selected":""}>${n}</option>`).join("")}</select></div>
    <button class="btn primary block" id="csave">${esc(t("save"))}</button>`,()=>{
      $("#cname").focus();
      $("#csave").onclick=()=>{const name=$("#cname").value.trim();if(!name){$("#cname").focus();return}
        S.customers.push({id:uid(),name,phone:$("#cphone").value.replace(/\D/g,""),lang:$("#clang").value,entries:[]});persist();close();render();toast(t("cust_added"))}});},
  newprod(){sheet(`<div class="sheet-h"><h3>${esc(t("new_product"))}</h3><button class="x" data-close aria-label="${esc(t("close"))}">×</button></div>
    ${fld("pname","product_name","")}<div class="grid2">${fld("pprice","price","","number")}${fld("phsn","hsn","")}</div>
    <div class="field"><label for="pgst">${esc(t("gst_rate"))}</label><select id="pgst">${[0,5,18,40].map(r=>`<option value="${r}" ${r===5?"selected":""}>${r}%</option>`).join("")}</select></div>
    <button class="btn primary block" id="psave">${esc(t("save"))}</button>`,()=>{$("#pname").focus();
      $("#psave").onclick=()=>{const name=$("#pname").value.trim();const price=parseFloat($("#pprice").value);if(!name||!(price>0))return;
        const p={id:uid(),name,price,hsn:$("#phsn").value.trim()||"—",gst:+$("#pgst").value};S.products.push(p);draft.items.push({pid:p.id,name:p.name,hsn:p.hsn,gst:p.gst,qty:1,rate:p.price});persist();close();render()}});},
  savebill(){
    if(!draft.items.length)return;
    let cust=draft.cust,phone=draft.phone;
    if(draft.mode==="credit"){const c=S.customers.find(x=>x.id===draft.custId);if(!c){toast(t("need_customer"));return}cust=c.name;phone=c.phone}
    const no=(S.bills.reduce((m,b)=>Math.max(m,b.no),0))+1;
    const b={id:uid(),no,date:TODAY,items:draft.items.map(x=>({...x})),cust,phone,inter:draft.inter,mode:draft.mode,gt:S.shop.gstType};
    S.bills.push(b);
    if(draft.mode==="credit"){const c=S.customers.find(x=>x.id===draft.custId);c.entries.push({id:uid(),type:"credit",amt:calc(b).total,date:TODAY,note:invNo(b)})}
    draft={items:[],cust:"",phone:"",custId:"",inter:false,mode:"cash"};persist();render();billSheet(b.id);
  },
  addexp(){sheet(`<div class="sheet-h"><h3>${esc(t("add_expense"))}</h3><button class="x" data-close aria-label="${esc(t("close"))}">×</button></div>
    <input class="keypad-amt num" id="eamt" inputmode="decimal" placeholder="₹0">
    <div class="field"><label for="ecat">${esc(t("expense_cat"))}</label><select id="ecat">${["Purchase","Rent","Electricity","Salary","Transport","Tea & snacks","Other"].map(c=>`<option>${c}</option>`).join("")}</select></div>
    <button class="btn primary block" id="esave">${esc(t("save"))}</button>`,()=>{$("#eamt").focus();
      $("#esave").onclick=()=>{const a=parseFloat($("#eamt").value);if(!(a>0))return;S.expenses.push({id:uid(),date:TODAY,amt:a,cat:$("#ecat").value});persist();close();render();toast(t("saved"))}});},
  saveshop(){const g=id=>$("#"+id)?$("#"+id).value.trim():undefined;const sh=S.shop;
    sh.name=g("sname")||sh.name;sh.owner=g("sowner");sh.phone=g("sphone");sh.upi=g("supi");sh.address=g("saddr");
    if(g("sgstin")!==undefined)sh.gstin=g("sgstin").toUpperCase();
    const m=g("smaps");sh.maps=m&&!/^https?:\/\//.test(m)?"https://"+m:m;
    sh.insta=(g("sinsta")||"").replace(/^@/,"").replace(/\s/g,"");sh.lang=g("slang");sh.billLang=g("sblang");S.sample=false;persist();render();toast(t("saved"))},
  reset(){sheet(`<div class="sheet-h"><h3>${esc(t("reset"))}</h3><button class="x" data-close aria-label="${esc(t("close"))}">×</button></div>
    <p style="margin:0">${esc(t("confirm_reset"))}</p><div class="row"><button class="btn" data-close>${esc(t("cancel"))}</button><button class="btn owe" id="rok">${esc(t("yes_reset"))}</button></div>`,()=>{
      $("#rok").onclick=()=>{const lang=S.shop.lang;S=seed();S.shop.lang=lang;draft={items:[],cust:"",phone:"",custId:"",inter:false,mode:"cash"};persist();close();go("home")}});}
};

/* ---------- sheets ---------- */
function sheet(html,mount){
  $("#layer").innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`;
  $("#scrim").onclick=e=>{if(e.target.id==="scrim")close()};
  document.querySelectorAll("#layer [data-close]").forEach(b=>b.onclick=close);
  mount&&mount();
}
function close(){$("#layer").innerHTML=""}
document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});

function custSheet(id){
  const c=S.customers.find(x=>x.id===id);if(!c)return;const b=bal(c);
  const msg=tl(c.lang,"reminder",{name:c.name,amt:b.toLocaleString("en-IN"),shop:S.shop.name,upi:S.shop.upi});
  const ents=[...c.entries].sort((a,b)=>a.date<b.date?1:-1);
  sheet(`<div class="sheet-h"><div style="display:flex;gap:10px;align-items:center;min-width:0"><div class="av">${esc(initials(c.name))}</div><div style="min-width:0"><h3>${esc(c.name)}</h3><small class="num" style="color:var(--muted)">${esc(c.phone)}</small></div></div><button class="x" data-close aria-label="${esc(t("close"))}">×</button></div>
    <div class="big-bal"><div class="val num ${b>0?"owe":"paid"}">${b>0?inr(b):inr(0)}</div><small>${b>0?esc(t("owes")):esc(t("all_settled"))}</small></div>
    <div class="row"><button class="btn owe" id="gcredit">${ICON.credit.replace("<svg",'<svg width="20" height="20"')}${esc(t("gave_credit"))}</button><button class="btn paid" id="gpay">${ICON.pay.replace("<svg",'<svg width="20" height="20"')}${esc(t("got_payment"))}</button></div>
    ${b>0?`<a class="btn brand block" target="_blank" rel="noopener" href="${waLink(c.phone,msg)}">${ICON.wa.replace("<svg",'<svg width="20" height="20"')}${esc(t("send_reminder"))}</a>
      <div class="note">${esc(msg)}</div>`:""}
    <div class="field"><label for="clang2">${esc(t("reminder_lang"))}</label><select id="clang2">${LANGS.map(([cc,,n])=>`<option value="${cc}" ${c.lang===cc?"selected":""}>${n}</option>`).join("")}</select></div>
    <section class="card"><div class="sec-h"><h2>${esc(t("entries"))}</h2></div><div class="list">
      ${ents.length?ents.map(e=>`<div class="item"><div class="main"><b class="${e.type==="credit"?"owe":"paid"}">${e.type==="credit"?esc(t("gave_credit")):esc(t("got_payment"))}</b><small>${nice(e.date)}${e.note?" · "+esc(e.note):""}</small></div>
        <div class="amt num ${e.type==="credit"?"owe":"paid"}">${e.type==="credit"?"+":"−"}${inr(e.amt)}</div><button class="btn sm" data-del="${e.id}" aria-label="${esc(t("delete"))}">✕</button></div>`).join(""):`<div class="empty">—</div>`}</div></section>`,()=>{
    $("#gcredit").onclick=()=>entrySheet(c,"credit");$("#gpay").onclick=()=>entrySheet(c,"payment");
    $("#clang2").onchange=e=>{c.lang=e.target.value;persist();custSheet(id)};
    document.querySelectorAll("[data-del]").forEach(btn=>btn.onclick=()=>{const i=c.entries.findIndex(x=>x.id===btn.dataset.del);const [rem]=c.entries.splice(i,1);persist();render();custSheet(id);
      toast(t("entry_deleted"),()=>{c.entries.splice(i,0,rem);persist();render();custSheet(id)})});
  });
}
function entrySheet(c,type){
  sheet(`<div class="sheet-h"><h3 class="${type==="credit"?"owe":"paid"}">${esc(type==="credit"?t("gave_credit"):t("got_payment"))}</h3><button class="x" data-close aria-label="${esc(t("close"))}">×</button></div>
    <small style="color:var(--muted)">${esc(c.name)}</small>
    <input class="keypad-amt num" id="eamt" inputmode="decimal" placeholder="₹0" aria-label="${esc(t("amount"))}">
    <div class="words" id="ewords"></div>
    ${fld("enote","note","")}
    <button class="btn primary block" id="esave">${esc(t("save"))}</button>`,()=>{
    const a=$("#eamt");a.focus();a.oninput=()=>{const v=parseFloat(a.value);$("#ewords").textContent=v>0?"Rupees "+words(v)+" only":""};
    $("#esave").onclick=()=>{const v=parseFloat(a.value);if(!(v>0)){a.focus();return}
      c.entries.push({id:uid(),type,amt:Math.round(v*100)/100,date:TODAY,note:$("#enote").value.trim()});persist();render();custSheet(c.id);toast("✓ "+t("saved"))};
  });
}
function invoiceHTML(b){
  const sh=S.shop,c=calc(b),L=sh.billLang||"en",bt=k=>tl(L,k);
  const title=c.gt==="regular"?bt("tax_invoice"):c.gt==="composition"?bt("bill_supply"):bt("bill_receipt");
  return `<div class="inv">
    <div class="ihead"><div class="ilogo">${sh.logo?`<img src="${sh.logo}" alt="">`:esc(initials(sh.name))}</div>
      <div style="min-width:0"><h4>${esc(sh.name)}</h4><div class="muted">${esc(sh.address)}</div><div class="muted num">${esc(sh.phone)}${c.gt!=="none"&&sh.gstin?" · GSTIN "+esc(sh.gstin):""}</div></div></div>
    <div class="ttl">${esc(title)}</div>
    <div class="meta num"><span>${esc(bt("invoice_no"))}: <b>${esc(invNo(b))}</b></span><span>${esc(bt("date"))}: ${new Date(b.date+"T00:00").toLocaleDateString("en-IN")}</span></div>
    <div class="meta"><span>${esc(b.cust||bt("walkin"))}${b.phone?" · "+esc(b.phone):""}</span><span>${c.gt==="regular"?(b.inter?"IGST":"CGST + SGST · "+esc(sh.state)):""}</span></div>
    <div class="tblwrap"><table><thead><tr><th>${esc(bt("items"))}</th><th>HSN</th><th class="r">${esc(bt("qty"))}</th><th class="r">${esc(bt("rate"))}</th>${c.gt==="regular"?"<th class='r'>GST</th>":""}<th class="r">₹</th></tr></thead>
      <tbody>${c.lines.map(l=>`<tr><td>${esc(l.name)}</td><td>${esc(l.hsn)}</td><td class="r">${l.qty}</td><td class="r">${l.rate.toFixed(2)}</td>${c.gt==="regular"?`<td class="r">${l.gst}%</td>`:""}<td class="r">${l.val.toFixed(2)}</td></tr>`).join("")}</tbody></table></div>
    <div class="tot"><span>${esc(bt("taxable"))}</span><span>${c.taxable.toFixed(2)}</span>
      ${c.gt==="regular"?(b.inter?`<span>IGST</span><span>${c.igst.toFixed(2)}</span>`:`<span>CGST</span><span>${c.cgst.toFixed(2)}</span><span>SGST</span><span>${c.sgst.toFixed(2)}</span>`):""}
      <span>${esc(bt("round_off"))}</span><span>${c.round.toFixed(2)}</span>
      <span class="g">${esc(bt("total"))}</span><span class="g">${inr(c.total,1)}</span></div>
    <div class="muted" style="margin-top:6px;font-size:12px">${esc(bt("in_words"))}: Rupees ${words(c.total)} only</div>
    <div class="foot">
      ${b.mode==="credit"?`<b>${esc(bt("credit_mode"))}</b>`:`<span>${esc(bt("pay_mode"))}: <b>${b.mode==="cash"?esc(bt("cash")):"UPI"}</b></span>`}
      ${sh.upi?`<span class="muted">${esc(tl(L,"pay_upi_line",{upi:sh.upi}))}</span>`:""}
      ${sh.maps||sh.insta?`<div class="links">${sh.maps?`<a href="${esc(sh.maps)}" target="_blank" rel="noopener">${ICON.pin}${esc(bt("find_maps"))}</a>`:""}${sh.insta?`<a href="https://instagram.com/${encodeURIComponent(sh.insta)}" target="_blank" rel="noopener">${ICON.ig}@${esc(sh.insta)}</a>`:""}</div>`:""}
      <b>${esc(bt("thank_you"))}</b>
      <span class="muted" style="font-size:11px">Powered by Ledgro · ledgro.co.in</span>
    </div></div>`;
}
function billSheet(id){
  const b=S.bills.find(x=>x.id===id);if(!b)return;const c=calc(b);const sh=S.shop;
  const txt=`${sh.name}\n${invNo(b)} · ${new Date(b.date+"T00:00").toLocaleDateString("en-IN")}\n`+c.lines.map(l=>`${l.name} x${l.qty} = ${inr(l.val+l.tx,1)}`).join("\n")+`\n${t("total")}: ${inr(c.total)}`+(sh.upi?`\nUPI: ${sh.upi}`:"")+(sh.maps?`\n${sh.maps}`:"")+(sh.insta?`\ninstagram.com/${sh.insta}`:"");
  sheet(`<div class="sheet-h"><h3>${esc(t("show_bill"))}</h3><button class="x" data-close aria-label="${esc(t("close"))}">×</button></div>
    ${invoiceHTML(b)}
    <a class="btn brand block" target="_blank" rel="noopener" href="${waLink(b.phone,txt)}">${ICON.wa.replace("<svg",'<svg width="20" height="20"')}${esc(t("share_whatsapp"))}</a>
    <div class="note">${esc(t("pdf_note"))}</div>`);
}

/* ---- IndexedDB key-value ---- */
let _db;
function idb(){if(_db)return Promise.resolve(_db);return new Promise((res,rej)=>{const r=indexedDB.open("ledgro",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>{_db=r.result;res(_db)};r.onerror=()=>rej(r.error)})}
async function kvGet(k){const db=await idb();return new Promise((res,rej)=>{const q=db.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function kvSet(k,v){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction("kv","readwrite");tx.objectStore("kv").put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function kvDel(k){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction("kv","readwrite");tx.objectStore("kv").delete(k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}

/* ---- crypto ---- */
function b64(u8){let s="";for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)}
function unb64(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function deriveKey(pin,salt,iter){const base=await crypto.subtle.importKey("raw",enc.encode(pin),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:iter||ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
let KEYC=null,SALT=null,META={};
async function encryptState(){const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},KEYC,enc.encode(JSON.stringify(S))));
  return{app:"ledgro",v:1,kdf:"PBKDF2-SHA256",iter:ITER,salt:b64(SALT),iv:b64(iv),ct:b64(ct),saved:new Date().toISOString()}}
async function decryptBlob(blob,pin){const salt=unb64(blob.salt);const key=await deriveKey(pin,salt,blob.iter);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(blob.iv)},key,unb64(blob.ct));
  return{state:JSON.parse(dec.decode(pt)),key,salt}}
const isBlob=b=>b&&b.app==="ledgro"&&b.salt&&b.iv&&b.ct;
async function saveMeta(){try{await kvSet("meta",META)}catch(e){}}
let saveTimer=null;
function persist(){clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,300)}
async function saveNow(){clearTimeout(saveTimer);if(!KEYC||!S)return;
  try{const blob=await encryptState();await kvSet("vault",blob);
    if(META.lang!==S.shop.lang){META.lang=S.shop.lang;saveMeta()}
    autoBackup();
  }catch(e){toast("Could not save on this phone. Free some storage and try again.")}}

/* ---- boot / gates ---- */
let OB={};
async function boot(){
  try{META=(await kvGet("meta"))||{}}catch(e){META={}}
  if(!META.shopId){META.shopId=crypto.randomUUID?crypto.randomUUID():[...crypto.getRandomValues(new Uint8Array(16))].map(b=>b.toString(16).padStart(2,"0")).join("");META.autoLock=META.autoLock||5;saveMeta()}
  let blob=null;try{blob=await kvGet("vault")}catch(e){}
  if(isBlob(blob))showLock();else showWelcome();
  if("serviceWorker" in navigator&&location.protocol==="https:"&&CFG.pwa)navigator.serviceWorker.register("sw.js").catch(()=>{});
}
const gl=k=>tl(OB.lang||META.lang||"en",k);

/* ---- backup: Google Drive (drive.file) + share file ---- */
let gTok=null,gTokExp=0;
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`))return res();const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function getToken(){if(gTok&&Date.now()<gTokExp-60000)return gTok;
  await loadScript("https://accounts.google.com/gsi/client");
  return new Promise((res,rej)=>{const c=google.accounts.oauth2.initTokenClient({client_id:CFG.googleClientId,scope:"https://www.googleapis.com/auth/drive.file",
    callback:r=>{if(r.error)return rej(r);gTok=r.access_token;gTokExp=Date.now()+r.expires_in*1000;res(gTok)},error_callback:rej});c.requestAccessToken({prompt:""})})}
const BACKUP_NAME="Ledgro backup.ledgro";
async function driveUpload(){
  const tok=await getToken();const blob=await kvGet("vault");if(!isBlob(blob))return;
  const bd="ledgro"+Date.now();const meta={name:BACKUP_NAME,mimeType:"application/json",description:"Encrypted Ledgro shop backup. Open Ledgro and choose Restore to use it."};
  const body=`--${bd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(META.driveFileId?{name:BACKUP_NAME}:meta)}\r\n--${bd}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(blob)}\r\n--${bd}--`;
  const url=META.driveFileId?`https://www.googleapis.com/upload/drive/v3/files/${META.driveFileId}?uploadType=multipart`:"https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart";
  const r=await fetch(url,{method:META.driveFileId?"PATCH":"POST",headers:{Authorization:"Bearer "+tok,"Content-Type":"multipart/related; boundary="+bd},body});
  if(r.status===404&&META.driveFileId){META.driveFileId=null;return driveUpload()}
  if(!r.ok)throw new Error("drive "+r.status);
  const j=await r.json();META.driveFileId=j.id;META.lastBackup=Date.now();await saveMeta();
}
async function driveDownload(){
  const tok=await getToken();
  const q=encodeURIComponent(`name='${BACKUP_NAME}' and trashed=false`);
  const r=await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&orderBy=modifiedTime%20desc&pageSize=1&fields=files(id,modifiedTime)`,{headers:{Authorization:"Bearer "+tok}});
  if(!r.ok)throw new Error("list");const j=await r.json();if(!j.files||!j.files.length)return null;
  const f=await fetch(`https://www.googleapis.com/drive/v3/files/${j.files[0].id}?alt=media`,{headers:{Authorization:"Bearer "+tok}});
  if(!f.ok)throw new Error("get");META.driveFileId=j.files[0].id;saveMeta();const blob=await f.json();return isBlob(blob)?blob:null;
}
let lastAuto=0;
function autoBackup(){ // silent while this session already holds a Drive token
  if(!CFG.googleClientId||!gTok||Date.now()>=gTokExp-60000)return;
  if(Date.now()-lastAuto<10*60000)return;lastAuto=Date.now();
  driveUpload().then(()=>{if(view==="more"||view==="home")render()}).catch(()=>{});
}
async function shareBackup(){
  await saveNow();const blob=await kvGet("vault");if(!isBlob(blob))return;
  const name=`Ledgro-backup-${TODAY}.ledgro`;
  const file=new File([JSON.stringify(blob)],name,{type:"application/json"});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],title:"Ledgro backup",text:"Encrypted Ledgro shop backup. Keep this file safe."});
    else{const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
    META.lastBackup=Date.now();await saveMeta();render();toast(t("backup_done"));
  }catch(e){if(e&&e.name!=="AbortError")toast(t("backup_fail"))}
}
async function backupNow(){
  if(CFG.googleClientId){try{await saveNow();await driveUpload();render();toast(t("backup_done"))}catch(e){toast(t("backup_fail"))}}
  else shareBackup();
}

      if(!live){if(API!==undefined){toast("Online payments open soon. Our team will activate your plan.");return}S.plan={...S.plan,name:id,billing};persist();close();render();toast("✓ "+name);return}
      $("#rzok").disabled=true;
      try{const r=await fetch(`${API}/subscribe`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({shop:META.shopId,plan:id,billing,phone:S.shop.phone})});
        const j=await r.json();if(!r.ok||!j.subscription_id)throw new Error(j.error||"subscribe");
        await loadScript("https://checkout.razorpay.com/v1/checkout.js");
        const rp=new Razorpay({key:CFG.razorpayKeyId,subscription_id:j.subscription_id,name:"Ledgro",description:`${name} plan (${billing})`,prefill:{contact:S.shop.phone},theme:{color:"#B91725"},
          handler:()=>{close();toast(t("plan_wait"));let n=0;const iv=setInterval(()=>{n++;refreshLicense();if(n>=6||S?.plan?.name===id)clearInterval(iv)},4000)}});
        rp.on("payment.failed",()=>toast(t("pay_fail")));rp.open();
      }catch(e){toast(t("pay_fail"));const b=$("#rzok");if(b)b.disabled=false}};
  });draw();
}

/* ---------- toast ---------- */
let tt;
function toast(msg,undo){
  clearTimeout(tt);const el=document.createElement("div");el.className="toast";el.innerHTML=`<span>${esc(msg)}</span>${undo?`<button>${esc(t("undo"))}</button>`:""}`;
  document.querySelectorAll(".toast").forEach(x=>x.remove());document.body.appendChild(el);
  if(undo)el.querySelector("button").onclick=()=>{undo();el.remove()};
  tt=setTimeout(()=>el.remove(),undo?5000:2200);
}

boot();
</script>
